<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PK Kinetic Captions</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="panel.css">
</head>
<body class="panel">
<header class="pbar">
  <span class="mark"></span>
  <span class="ptitle">Kinetic Captions</span>
  <span class="spacer"></span>
  <span id="link" class="plink">not connected</span>
</header>

<section class="pstep" id="step-source">
  <div id="pdrop" class="pdrop">
    <strong>Drag a clip here</strong>
    <span>from the browser or the timeline</span>
  </div>
  <p id="source-note" class="hint"></p>
</section>

<section class="pstep">
  <h2>Style</h2>
  <div id="styles" class="pstyles"></div>
</section>

<section class="pstep">
  <h2>Text size <span id="size-orient" class="hint"></span></h2>
  <div class="size-row">
    <input type="range" id="size" min="50" max="200" step="5" value="100">
    <span id="size-val" class="mono">100%</span>
  </div>
  <p class="hint">Remembered separately for vertical and horizontal video.</p>

  <h2 class="mt">Main text</h2>
  <div class="seg wide" id="main-look">
    <button data-v="clean">Normal</button><button data-v="invert">Difference</button><button data-v="luminous">Screen</button><button data-v="cinematic">Overlay</button>
  </div>
  <div class="accent-row mt-s">
    <input type="color" id="main-colour" value="#f7f6f3">
    <input type="text" id="main-colour-hex" class="mono" spellcheck="false" value="#f7f6f3">
  </div>

  <h2 class="mt">Highlights</h2>
  <div class="seg wide" id="highlight-look">
    <button data-v="clean">Normal</button><button data-v="invert">Difference</button><button data-v="luminous">Screen</button><button data-v="cinematic">Overlay</button>
  </div>
  <div class="accent-row mt-s">
    <input type="color" id="accent" value="#c9a84c">
    <input type="text" id="accent-hex" class="mono" spellcheck="false" value="#c9a84c">
  </div>

  <h2 class="mt">Colour pattern</h2>
  <div class="seg wide" id="pattern-scope">
    <button data-v="off" class="is-on">Off</button><button data-v="highlights">Highlights</button><button data-v="all">Every word</button><button data-v="phrases">Phrases</button>
  </div>
  <div id="pattern" class="pattern-row mt-s"></div>

  <h2 class="mt">Emphasis</h2>
  <div class="seg wide" id="emphasis">
    <button data-v="subtle">Subtle</button><button data-v="balanced" class="is-on">Balanced</button><button data-v="strong">Strong</button>
  </div>

  <h2 class="mt">Density</h2>
  <div class="seg wide" id="density">
    <button data-v="low">Low</button><button data-v="medium" class="is-on">Medium</button><button data-v="high">High</button>
  </div>
</section>

<section class="pstep">
  <h2>Words <span id="wstats" class="hint"></span></h2>
  <div id="words" class="words"></div>
</section>

<footer class="pfoot">
  <div id="dragout" class="dragchip is-off" title="Drag onto your Final Cut timeline, above the clip">
    <b>Drag to timeline</b><span>drop it above your clip, like a title</span>
  </div>
  <button id="apply" class="ghost sm wide" disabled>Or import as a new project</button>
  <p id="status" class="hint"></p>
</footer>

<script type="module" src="panel.js"></script>
</body>
</html>
