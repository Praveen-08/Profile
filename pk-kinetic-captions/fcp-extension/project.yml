# XcodeGen project definition.
#
# A hand-written project.pbxproj is thousands of lines of generated UUIDs that
# nobody can review and any merge will corrupt. This is the same project in a
# form you can read and diff:
#
#   brew install xcodegen
#   cd fcp-extension && xcodegen && open PKKineticCaptions.xcodeproj
#
# The host app exists only because macOS requires an app extension to ship
# inside one. It launches, tells you the panel is installed, and gets out of
# the way.

name: PKKineticCaptions

options:
  bundleIdPrefix: nz.pkvisuals
  deploymentTarget:
    # Final Cut 12.2 itself needs 15.6, and ProExtension.framework is built for it.
    macOS: "15.6"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed with PK Visuals' Developer ID on every build — not ad hoc. macOS
    # remembers a permission (such as reading an external drive) against the
    # app's signature; an ad-hoc signature changes on every build, which is
    # why the drive-access prompt kept coming back. A stable Developer ID
    # signature is asked once and remembered across updates.
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: W7SLDL8U36
    CODE_SIGN_IDENTITY: "Developer ID Application: praveenkumar subramaniyan (W7SLDL8U36)"
    OTHER_CODE_SIGN_FLAGS: --timestamp
    # Required for notarisation, and what makes the signature meaningful.
    ENABLE_HARDENED_RUNTIME: YES
    # Never ship the debugger entitlement (mExtension does — we do not).
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Apple Silicon and Intel: Final Cut still runs on both.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO

targets:

  PKKineticCaptions:
    type: application
    platform: macOS
    sources:
      - path: Host
    # No `info:` block, here or below. With one, xcodegen regenerates the
    # plist on every run — and for the extension that silently deleted
    # NSExtension, so Final Cut never listed the panel. The plists are
    # hand-maintained and referenced directly instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.pkvisuals.kinetic-captions
        INFOPLIST_FILE: Host/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: PKCaptionsExtension
        embed: true
        codeSign: true

  PKCaptionsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - Resources/**
          - Extension.entitlements
      # The engine and panel, copied in by scripts/bundle-web.mjs. They go in
      # as a folder reference so the directory layout survives — the modules
      # import each other by relative path.
      - path: Extension/Resources/web
        type: folder
        buildPhase: resources
      # The PK Kinetic Caption Motion title (motion/publish.py builds it),
      # installed into ~/Movies/Motion Templates on launch.
      - path: Extension/Resources/title
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.pkvisuals.kinetic-captions.extension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        SKIP_INSTALL: YES
        # Final Cut's own ProExtension.framework defines the two classes the
        # extension point names: ProExtensionRequestHandling (the principal
        # class) and ProExtensionRemoteContext (the context class). Without
        # them in this image, ExtensionFoundation traps at launch: "Unable to
        # find NSExtensionContextClass". The framework ships no headers, so
        # this is link-only and the classes are reached with NSClassFromString.
        # The path has spaces, hence the embedded quotes; and plain -framework
        # can be dropped as unused, hence -needed_framework.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - '"/Applications/Final Cut Pro.app/Contents/Frameworks"'
        OTHER_LDFLAGS: "-Wl,-needed_framework,ProExtension"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../../../../Frameworks"
          - '"/Applications/Final Cut Pro.app/Contents/Frameworks"'
    preBuildScripts:
      - name: Bundle the caption engine
        script: |
          # Keeps the panel's engine identical to the CLI's. Fails the build
          # rather than shipping a panel whose design decisions have drifted.
          if command -v node >/dev/null 2>&1; then
            node "$SRCROOT/scripts/bundle-web.mjs" || exit 1
          else
            echo "warning: node not found; Extension/Resources/web was not refreshed"
          fi
        basedOnDependencyAnalysis: false
