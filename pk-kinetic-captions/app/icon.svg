<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    PK Kinetic Captions.

    The mark is the product's one idea: three lines of type at three weights
    and three scales — supporting, emphasis, hero. At 1024px it reads as
    typography; at 16px in the dock it still reads as hierarchy, which is the
    only thing an icon that small can say.

    Laid out on the Big Sur grid: an 824pt squircle inside a 1024pt canvas.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c1a17"/>
      <stop offset="0.55" stop-color="#101010"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfc278"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="196" fill="url(#plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="196" fill="none"
        stroke="rgba(255,255,255,0.07)" stroke-width="3"/>

  <g filter="url(#lift)">
    <!-- supporting -->
    <rect x="236" y="330" width="286" height="46" rx="23" fill="#f0ede8" opacity="0.5"/>
    <!-- emphasis -->
    <rect x="236" y="424" width="452" height="82" rx="41" fill="#f0ede8" opacity="0.92"/>
    <!-- hero -->
    <rect x="236" y="554" width="552" height="146" rx="73" fill="url(#gold)"/>
  </g>
</svg>
