<div class="view" id="view-packages">
  <div class="panel">
    <div class="btn-row" style="margin-bottom:16px;">
      <div class="btn btn-gold" onclick="openPackageModal(null)">+ Add Package</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Package</th><th>Price (incl GST)</th><th>Includes</th><th>Duration</th><th>Active</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="packages-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-package">
  <div class="modal">
    <span class="modal-close" onclick="closeModal('modal-package')">&times;</span>
    <h2 id="pkg-modal-title">Add Package</h2>
    <input type="hidden" id="pkg-id">
    <label>Package Name *</label>
    <input id="pkg-name">
    <label>Description</label>
    <textarea id="pkg-description" rows="2"></textarea>
    <label>Default Price (incl GST) *</label>
    <input id="pkg-price" type="number" step="0.01">
    <label>Default Shoot Duration (minutes)</label>
    <input id="pkg-duration" type="number" step="5">
    <div class="field-row">
      <div class="checkbox-row"><input type="checkbox" id="pkg-photos"><label style="margin:0;">Photos</label></div>
      <div class="checkbox-row"><input type="checkbox" id="pkg-video"><label style="margin:0;">Video</label></div>
    </div>
    <div class="field-row">
      <div class="checkbox-row"><input type="checkbox" id="pkg-floorplan"><label style="margin:0;">Floor Plan</label></div>
      <div class="checkbox-row"><input type="checkbox" id="pkg-drone"><label style="margin:0;">Drone</label></div>
    </div>
    <div class="checkbox-row"><input type="checkbox" id="pkg-twilight"><label style="margin:0;">Twilight</label></div>
    <div class="checkbox-row"><input type="checkbox" id="pkg-active" checked><label style="margin:0;">Active</label></div>
    <div class="btn-row" style="margin-top:18px;">
      <div class="btn btn-gold btn-block" onclick="submitPackage()">Save Package</div>
    </div>
  </div>
</div>
